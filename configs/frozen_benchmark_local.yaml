# Nine pinned public checkpoints; run downloader verification before inference.
seed: 20261112
threads: 4
device: auto
mixed_precision: true
data_root_env: MPOWER_DATA_ROOT
eda_root_env: MPOWER_OUTPUT_ROOT
benchmark_root_env: MPOWER_BENCHMARK_ROOT
manifest: null
cohort: B
quality:
  min_duration_s: 2
  reject_flags:
  - flag_near_silent
  - flag_short
audio:
  sample_rate: 16000
  segment_seconds: 10
  hop_seconds: 10
  max_decode_seconds: 180
  max_segments: 12
batch_size: 1
participant_aggregation: mean
pooling: mean
layers:
- -1
heads:
- logistic
- mlp
head:
  max_iter: 300
  hidden_dim: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
split_fractions:
- 0.7
- 0.15
- 0.15
smoke_participants_per_class: 1
